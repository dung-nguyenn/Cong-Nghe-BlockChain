<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiceChain - Web3 Farming Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ethers.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <h1>RiceChain <span style="font-size: 1rem; color: var(--accent);">Web3</span></h1>
                <p>Hệ thống Nhật ký Canh tác trên mạng Ganache</p>
            </div>
            <div class="header-actions">
                <button id="btn-connect" class="glass" style="width: auto; padding: 0.6rem 1.2rem; background: var(--card-bg);">
                    <i class="fa-solid fa-wallet"></i> <span>Kết nối Ví</span>
                </button>
                <div id="chain-status" class="status-badge" style="margin-top: 0.5rem;">
                    <div class="pulse"></div>
                    <span>Chưa kết nối</span>
                </div>
            </div>
        </header>

        <div id="wallet-info" style="text-align: right; margin-bottom: 1rem; font-size: 0.8rem; color: var(--text-muted); display: none;">
            Địa chỉ ví: <span id="user-address" style="color: var(--primary);">0x0...</span>
        </div>

        <main class="dashboard-grid">
            <!-- Left Sidebar: Add Log -->
            <section class="form-section">
                <div class="form-card glass">
                    <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-plus-circle"></i> Thêm Nhật ký mới</h2>
                    <form id="farming-form">
                        <div class="form-group">
                            <label>Hộ Nông dân / Nhà cung cấp</label>
                            <input type="text" id="farmer-name" placeholder="VD: Nguyễn Văn A" required>
                        </div>
                        <div class="form-group">
                            <label>Giai đoạn canh tác</label>
                            <select id="farming-stage">
                                <option value="Sowing">Gieo mạ</option>
                                <option value="Fertilizing">Bón phân</option>
                                <option value="Pest Control">Phun thuốc / Diệt sâu bệnh</option>
                                <option value="Irrigation">Tưới tiêu</option>
                                <option value="Harvesting">Thu hoạch</option>
                                <option value="Processing">Chế biến / Đóng gói</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Chi tiết công việc</label>
                            <textarea id="farming-notes" rows="3" placeholder="Nhập chi tiết các loại vật tư, liều lượng..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Vị trí (Tọa độ/Số lô)</label>
                            <input type="text" id="farming-location" placeholder="VD: Lô 05, Cánh đồng Đông">
                        </div>
                        <button type="submit" id="btn-submit" disabled>
                            <i class="fa-solid fa-file-signature"></i> Ký & Gửi Giao dịch
                        </button>
                        <p id="hint-connect" style="font-size: 0.75rem; color: var(--danger); margin-top: 0.5rem; text-align: center;">
                            Vui lòng kết nối ví để thực hiện
                        </p>
                    </form>
                </div>
            </section>

            <!-- Right Content: Blockchain Feed -->
            <section class="blockchain-section">
                <div class="feed-header">
                    <h2><i class="fa-solid fa-link"></i> Nhật ký trên Blockchain</h2>
                    <div id="stats-summary" style="font-size: 0.9rem; color: var(--text-muted);">
                        Tổng cộng: <span id="block-count">0</span> bản ghi
                    </div>
                </div>
                
                <div id="blockchain-feed" class="block-list">
                    <!-- Blocks will be injected here -->
                    <div id="status-message" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        <i class="fa-solid fa-circle-info"></i> Vui lòng kết nối ví để xem dữ liệu.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Debug Info (Sẽ ẩn khi chạy tốt) -->
    <div id="debug-box" style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-size: 10px; z-index: 9999; border: 1px solid #444;">
        Protocol: <span id="debug-protocol">...</span> | 
        MetaMask: <span id="debug-mm">...</span> | 
        Ethers: <span id="debug-ethers">...</span>
    </div>

    <script>
        document.getElementById('debug-protocol').textContent = window.location.protocol;
        document.getElementById('debug-mm').textContent = (typeof window.ethereum !== 'undefined') ? "✅ Đã tìm thấy" : "❌ KHÔNG TÌM THẤY";
        document.getElementById('debug-mm').style.color = (typeof window.ethereum !== 'undefined') ? "#2ecc71" : "#e74c3c";
        document.getElementById('debug-ethers').textContent = (typeof ethers !== 'undefined') ? "✅ OK" : "❌ Lỗi tải";
    </script>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>
</html>
